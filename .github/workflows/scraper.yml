name: Scraper

# Aggiorna la tabella events da WeRace, XRace, KRM e RKC ASI (SWS escluso:
# reCAPTCHA). Tre modi di avvio:
#  * manuale, mode=dry-run (default): sola lettura, anon key;
#  * manuale, mode=real: scrive su Supabase, Environment "scraper-prod"
#    (con "Required reviewers" ogni run reale chiede approvazione);
#  * cron due volte al giorno: run reale, ma SOLO se la variabile del repo
#    SCRAPER_CRON_ENABLED vale "true" (Settings -> Secrets and variables ->
#    Actions -> Variables). Si attiva dopo il primo dry-run e il primo run
#    reale riusciti (docs/test-run-scraper.md). Usa l'Environment
#    "scraper-cron": crealo SENZA reviewer, altrimenti il cron aspetta
#    un'approvazione a ogni giro.
on:
  schedule:
    # 05:17 e 17:17 UTC = 7:17 e 19:17 in Italia (ora legale).
    - cron: "17 5,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = solo lettura; real = scrive su Supabase"
        type: choice
        options: [dry-run, real]
        default: dry-run
      force_prune:
        description: "Solo real: rimuove piu' di 25 righe obsolete (--force-prune)"
        type: boolean
        default: false

permissions:
  contents: read

# Mai due run insieme sullo stesso database.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
        with:
          toolkit-token: ${{ secrets.TOOLKIT_TOKEN }}
      - name: Dry-run (sola lettura, anon key)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python run_all.py --dry-run

  real-run:
    # Manuale con mode=real, oppure cron se abilitato dalla variabile.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'real') ||
      (github.event_name == 'schedule' && vars.SCRAPER_CRON_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'schedule' && 'scraper-cron' || 'scraper-prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
        with:
          toolkit-token: ${{ secrets.TOOLKIT_TOKEN }}
      - name: Run reale (scrive su Supabase)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_PRUNE: ${{ inputs.force_prune }}
        run: |
          # Esce con codice 1 se non scrive nulla: GitHub segnala il run e manda l'email.
          if [ "$FORCE_PRUNE" = "true" ]; then
            python run_all.py --force-prune
          else
            python run_all.py
          fi
