name: Setup scraper
description: Python, dipendenze (requirements-ci.txt + toolkit privato) e test unitari dello scraper.

inputs:
  toolkit-token:
    description: Token fine-grained con sola lettura su Fuchs665/it-scraper-toolkit
    required: true

runs:
  using: composite
  steps:
    # Libreria interna privata: il token serve solo al checkout, non finisce in URL di pip.
    - uses: actions/checkout@v4
      with:
        repository: Fuchs665/it-scraper-toolkit
        token: ${{ inputs.toolkit-token }}
        path: .toolkit-src

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: scraper/requirements-ci.txt

    - name: Installa le dipendenze
      shell: bash
      run: |
        pip install -r scraper/requirements-ci.txt
        pip install ./.toolkit-src

    - name: Test unitari
      shell: bash
      working-directory: scraper
      run: python -m unittest test_track_aliases
